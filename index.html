const FS=['#Morning Glow: A Story of Skin, Art and Self-Love','It started with a girl who simply wanted to feel comfortable in her own skin.','I was born in 2003 with eczema, and for as long as I can remember, my relationship with my skin has been a difficult one. What many people take for granted — waking up, looking in the mirror and feeling comfortable with what they see — was not always something I could enjoy.','My eczema affected my face, making an already personal struggle feel even more difficult. As a young girl, I was still discovering who I was, learning to make friends and finding my place in the world. Yet, sometimes, before people got to know me, they noticed my skin.','I remember the awkward stares, the curious looks and the questions from other children at school. “What is that on your face?” A question that might have seemed harmless to the person asking could stay with me long after the conversation had ended. It was difficult growing up feeling like something I had no control over was the first thing people saw when they looked at me.','Being a girl made that journey particularly personal. At an age when you begin becoming conscious of your appearance, beauty standards and how others perceive you, having a visible skin condition can affect the way you see yourself. There were moments when I wished I could simply wake up and have skin that did not attract questions, attention or unwanted curiosity.','Over the years, I tried dozens and dozens of skincare products, constantly searching for something that would make my relationship with my skin easier. Every new product brought another possibility, another little bit of hope and another attempt to find something that worked for me. My journey taught me patience, but it also taught me how exhausting it can be to navigate a world full of beauty promises when all you really want is to feel comfortable in your own skin.','*But my story was never only about my skin.','#Art, creativity and design','I have always had a deep love for art, creativity and design. After pursuing my passion and graduating from an art institution, I began looking at beauty from another perspective. I realised that creativity was something I could use to express myself, tell stories and create things that carried meaning beyond their appearance.','Eventually, two important parts of my life began to come together: my love for art and my personal journey towards embracing my natural beauty.','*That is where Morning Glow was born.','I wanted to create more than just handmade soaps. I wanted to build a brand that celebrates individuality, nature, creativity and the beauty of feeling comfortable in your own skin. A brand where thoughtful ingredients meet beautiful design, and where an everyday bathing routine can become a small moment of appreciation for yourself.','Every soap represents a little piece of that vision. From the ingredients and colours to the textures, presentation and packaging, I want each creation to feel intentional, personal and beautifully made.','#Why it is personal','Morning Glow is deeply personal to me because I understand what it feels like to search for confidence in your own skin. I know that everyone’s journey is different, and I know that beauty is not about having flawless skin or meeting someone else’s expectations.','I cannot promise that a bar of soap will erase every struggle someone has with their skin. But I can create products with thought, care and creativity, and build a brand that reminds people that their confidence and worth should never be defined by their skin.','Today, Morning Glow is my way of turning a difficult personal experience into something beautiful — combining my artistic eye, my love for nature and my desire to celebrate natural beauty.','Because everyone deserves to feel good in their own skin.','Welcome to Morning Glow.','*Reclaim your natural glow. Your skin, your confidence.'];
V['founders-story']=()=>`<section class='fhero'><div class='wrap split'><div><h1>Behind Morning Glow</h1><p class='lead'>Every brand has a story. This one began with a personal journey towards reclaiming natural beauty.</p></div>${F.photo?`<img class='fimg' src='${F.photo}' alt='Founder of Morning Glow'>`:`<div class='ph'>Founder photo<br>Owner: upload in the dashboard under Founder’s Story</div>`}</div></section><section><div class='wrap'><article class='story'>${FS.map(s=>s[0]==='#'?`<h2>${s.slice(1)}</h2>`:s[0]==='*'?`<p class='em'>${s.slice(1)}</p>`:`<p>${s}</p>`).join('')}</article></div></section><section class='band'><div class='wrap'><blockquote class='pq'>“${esc(F.quote)}”</blockquote></div></section><section><div class='wrap split'>${F.cpic?`<img class='fimg' src='${F.cpic}' alt='Morning Glow design and craft' style='max-width:100%'>`:`<div class='ph' style='aspect-ratio:16/10;max-width:100%'>Creative photo: designs, packaging, soap-making<br>Owner: upload in the dashboard</div>`}<div><h2>Where art meets soap</h2><p>Art, creativity and design have always been part of the founder’s life. At Morning Glow they shape the colours, textures, presentation and packaging of every soap.</p></div></div></section><section class='fclose' style='text-align:center'><div class='wrap'><p class='lead'>Thank you for being part of our journey. We hope every Morning Glow experience reminds you to appreciate yourself, celebrate your individuality and embrace your natural beauty.</p><a class='btn' href='#shop'>Explore Our Collection</a></div></section>`;

function lines(){return cart.map(c=>({p:P.find(p=>p.id===c.id),q:c.q})).filter(l=>l.p)}
